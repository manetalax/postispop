# Optional deployment profile for a future Nginx origin/reverse proxy.
# GitHub Pages does not read this file or let the repository set response headers.
# Requires Nginx built with ngx_brotli and TLS certificate paths supplied by host.

server {
    listen 80;
    server_name postispop.com www.postispop.com;
    return 301 https://postispop.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name postispop.com;
    root /srv/www/postispop;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/postispop.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/postispop.com/privkey.pem;

    brotli on;
    brotli_comp_level 5;
    brotli_types text/plain text/css application/javascript application/json
                 application/manifest+json application/xml image/svg+xml;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/manifest+json application/xml image/svg+xml;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://htfyjefmviwlgmfqrwue.supabase.co wss://htfyjefmviwlgmfqrwue.supabase.co; worker-src 'self' blob:; upgrade-insecure-requests" always;

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://htfyjefmviwlgmfqrwue.supabase.co wss://htfyjefmviwlgmfqrwue.supabase.co; worker-src 'self' blob:; upgrade-insecure-requests" always;
    }

    location ^~ /_next/static/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://htfyjefmviwlgmfqrwue.supabase.co wss://htfyjefmviwlgmfqrwue.supabase.co; worker-src 'self' blob:; upgrade-insecure-requests" always;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://htfyjefmviwlgmfqrwue.supabase.co wss://htfyjefmviwlgmfqrwue.supabase.co; worker-src 'self' blob:; upgrade-insecure-requests" always;
    }

    location ~* \.html$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://htfyjefmviwlgmfqrwue.supabase.co wss://htfyjefmviwlgmfqrwue.supabase.co; worker-src 'self' blob:; upgrade-insecure-requests" always;
    }
}
