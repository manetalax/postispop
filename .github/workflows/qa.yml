name: Review PostisPop changes
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test && npm run test:database && npm run lint && npm run build
      - run: node scripts/stage-site.mjs
      - run: npm run test:seo
      - run: node tests/camera-capture-ui.cjs
      - run: node --test tests/complete-note-share-ui.cjs tests/note-size-cleanup-ui.cjs && node tests/editor-themes-ui.cjs && node tests/note-controls-ui.cjs
      - run: node --test tests/android-download.test.cjs tests/share-ui.cjs
      - run: npm run test:backup && npm run test:exports && npm run test:notes-first && node tests/hydration-ui.cjs && npm run test:autosave && npm run test:experience && npm run test:premium && npm run test:atelier && npm run test:protected && npm run test:cloud-import && npm run test:offline-shell
      - uses: actions/upload-artifact@v6.0.0
        if: always()
        with:
          name: postispop-review-screenshots
          path: test-results/
          if-no-files-found: ignore
