name: Verify Android build (internal, unsigned)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', 'mobile/**', 'scripts/**', 'src/**', 'assets/**', '_next/**', '*.js', '*.css', '*.html', 'tests/**', '*.xml', '*.json', '*.webmanifest', '*.txt', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bundle local UI and shop
        run: npm ci && npm test && npm run lint && npm run build && node scripts/package-mobile.mjs
      - name: Install browser for local payload verification
        run: npx playwright install --with-deps chromium
      - name: Verify bundled resources, offline data and Android CSP
        run: node --test tests/packaging.test.cjs && npm run test:mobile
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Validate unsigned build candidates (not distributable installers)
        run: gradle -p android --no-daemon assembleDebug bundleRelease lintDebug lintRelease -PunsignedBeta
      - uses: actions/upload-artifact@v4
        with:
          name: postispop-internal-build-validation-NOT-AN-INSTALLER
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/reports/lint-results-debug.*
            android/app/build/reports/lint-results-release.*
          retention-days: 30
