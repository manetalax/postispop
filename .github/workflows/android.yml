name: Build Android beta
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', 'mobile/**', 'scripts/package-mobile.mjs', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bundle local UI and shop
        run: npm ci && npm run build && node scripts/package-mobile.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build unsigned beta APK and unsigned Play candidate
        run: gradle -p android --no-daemon assembleDebug bundleRelease lintDebug -PunsignedBeta
      - uses: actions/upload-artifact@v4
        with:
          name: postispop-android-unsigned
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/reports/lint-results-debug.*
          retention-days: 30
