name: Build and deploy PostisPop to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.3
      - name: Set up Node
        uses: actions/setup-node@v6.5.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install browser for verification
        run: npx playwright install --with-deps chromium
      - name: Build public pages and search index
        run: npm test && npm run test:database && npm run lint && npm run build
      - name: Stage the notes app and public pages
        run: node scripts/stage-site.mjs
      - name: Verify note layout, editing, encryption, cloud import and offline use
        run: npm run test:backup && npm run test:notes-first && node tests/hydration-ui.cjs && npm run test:autosave && npm run test:experience && npm run test:premium && npm run test:atelier && npm run test:protected && npm run test:cloud-import && npm run test:offline-shell
      - name: Preserve UI verification screenshots
        uses: actions/upload-artifact@v6.0.0
        if: always()
        with:
          name: postispop-deploy-screenshots
          path: test-results/
          if-no-files-found: ignore
      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
