name: Build and deploy PostisPop to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Astro storefront and Pagefind index
        run: npm run build
      - name: Stage existing app and Astro shop
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/tienda
          files=(index.html manifest.json robots.txt sitemap.xml CNAME favicon.svg privacy.html terms.html legal.html cookies.html postispop-shop.js commerce-ui.js commerce.css supabase-bridge.js supabase-config.js guest-board.js)
          for file in "${files[@]}"; do
            if [[ -f "$file" ]]; then cp --parents "$file" _site/; fi
          done
          for dir in assets _next api .well-known; do
            if [[ -d "$dir" ]]; then cp -a "$dir" _site/; fi
          done
          touch _site/.nojekyll
          cp -a astro-dist/. _site/tienda/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
