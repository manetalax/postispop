name: Build and deploy PostisPop to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build Astro storefront and Pagefind index
        run: npm test && npm run lint && npm run build
      - name: Stage existing app and Astro shop
        run: node scripts/stage-site.mjs
      - name: Install browser for UI verification
        run: npx playwright install --with-deps chromium
      - name: Verify editing, catalogue, encryption, offline use and responsive layout
        run: npm run test:experience && npm run test:premium && npm run test:atelier && npm run test:protected && npm run test:offline-shell
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
