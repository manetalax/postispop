<svg xmlns="http://www.w3.org/2000/svg" viewBox="55 60 480 480" role="img" aria-labelledby="title desc">
  <title id="title">PostIsPop</title>
  <desc id="desc">PostIsPop: una nota adhesiva amarilla frota una jarra contra los barrotes de su celda.</desc>
  <defs>
