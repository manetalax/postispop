plugins { id 'com.android.application' }

android {
    namespace 'com.postispop.android'
    compileSdk 36
    buildToolsVersion '36.0.0'
    androidResources {
        // The default also excludes .* and <dir>_*: that silently drops the
        // bundled _next and _astro JavaScript/CSS and leaves a broken offline
        // app. package-mobile already audits every file against its manifest.
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
    defaultConfig {
        applicationId 'com.postispop.android'
        minSdk 23
        targetSdk 36
        versionCode 5
        versionName '0.5.0'
        manifestPlaceholders = [appLabel: 'PostisPop']
    }
    def releaseStore = System.getenv('POSTISPOP_KEYSTORE')
    def releaseStorePassword = System.getenv('POSTISPOP_STORE_PASSWORD')
    def releaseKeyPassword = System.getenv('POSTISPOP_KEY_PASSWORD')
    def releaseKeyAlias = System.getenv('POSTISPOP_KEY_ALIAS') ?: 'postispop-release'
    def releaseSigningAvailable = releaseStore && releaseStorePassword && releaseKeyPassword
    signingConfigs {
        if (releaseSigningAvailable) {
            release {
                storeFile file(releaseStore)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
        debug {
            storeFile file('.signing/beta.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.beta'
            if (project.hasProperty('unsignedBeta')) { signingConfig null }
            versionNameSuffix '-beta'
            manifestPlaceholders = [appLabel: 'PostisPop Beta']
        }
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseSigningAvailable) signingConfig signingConfigs.release
            // Without the existing owner's key this remains an internal unsigned
            // build candidate. It must never be distributed as an installer.
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'androidx.activity:activity:1.10.1'
}
